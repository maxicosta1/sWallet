services:
  postgres:
    image: postgres:16-alpine
    container_name: scode-finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scode
      POSTGRES_PASSWORD: scode_password
      POSTGRES_DB: scode_finance
    ports:
      - "5432:5432"
    volumes:
      - scode-finance-data:/var/lib/postgresql/data

volumes:
  scode-finance-data:
